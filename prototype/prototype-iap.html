<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IAP Monitoring Tracker &mdash; Gapura Angkasa</title>
<meta name="description" content="Prototipe lengkap dasbor monitoring Improvement Action Plan PT Gapura Angkasa. Satu berkas HTML, tanpa pemasangan.">
<!--
  IAP Monitoring Tracker — prototipe satu berkas.
  Seluruh CSS dan JavaScript tertanam di berkas ini; tidak ada dependensi selain
  Google Fonts (IBM Plex), yang otomatis jatuh ke fon sistem bila tidak tersedia.
  Data contoh disimpan di localStorage peramban. Buka langsung dengan klik ganda.
  Dibuat 2026-09-21.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ---------- tokens ---------- */
:root {
  --canvas:#F2F5F3; --surface:#FFFFFF; --sunken:#F7F9F8; --sunken-2:#F0F3F1;
  --line:#DFE6E2; --line-soft:#EAEFEC; --line-strong:#CBD6D0;
  --rail:#16241E; --rail-line:#2A3D35; --rail-chip:#24382F; --rail-text:#C3D3CC; --rail-dim:#8FA49B;
  --ink:#16241E; --ink-mid:#46564F; --muted:#5C6B64; --faint:#8E9B95;
  --accent:#2F6F53; --accent-deep:#1E5640; --accent-soft:#E3EFE8; --accent-line:#C3DCCE;
  --done:#1F6B41; --done-soft:#E1F0E6; --done-bar:#3D8C5C;
  --run:#8A5A0B; --run-soft:#FAEEDA; --run-bar:#C08A2E; --run-line:#E8D9BC; --run-tint:#FDF8EF;
  --idle:#4B5651; --idle-soft:#EBEFED; --idle-bar:#A7B2AD;
  --late:#A8322A; --late-soft:#FAE7E4; --late-line:#E4C7C2; --late-bar:#C0473C; --late-tint:#FEFAF9;
  --track:#E4E9E6;
  --rail-w:236px; --r:10px;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:13.5px;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,dl,dd,ol,ul{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-deep)}
button,input,select,textarea{font:inherit;color:inherit}
table{border-collapse:collapse;width:100%}
:where(a,button,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--surface);border:1px solid var(--accent);color:var(--accent);padding:10px 16px;border-radius:8px;font-weight:600}
.skip:focus{left:8px}
.grow{flex:1 1 auto;min-width:0}
.spacer{flex:1 1 auto}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.rail{width:var(--rail-w);flex:0 0 var(--rail-w);background:var(--rail);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.rail-brand{padding:22px 20px 18px;display:flex;align-items:center;gap:10px}
.rail-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;flex-shrink:0}
.rail-name{display:flex;flex-direction:column;line-height:1.2}
.rail-name b{font-size:13.5px;font-weight:600;color:#fff;letter-spacing:-.01em}
.rail-name span{font-size:10.5px;color:var(--rail-dim)}
.rail-nav{padding:6px 12px;display:flex;flex-direction:column;gap:2px}
.rail-nav a{display:flex;align-items:center;gap:11px;min-height:40px;padding:0 12px;border-radius:8px;color:var(--rail-text);font-size:13px;font-weight:500}
.rail-nav a:hover{background:#1E3129;color:#fff}
.rail-nav a[aria-current="page"]{background:var(--accent);color:#fff;font-weight:600}
.rail-badge{margin-left:auto;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--late);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.rail-nav a[aria-current="page"] .rail-badge{background:#fff;color:var(--accent-deep)}
.rail-foot{border-top:1px solid var(--rail-line);padding:14px 16px 18px;display:flex;flex-direction:column;gap:10px}
.rail-chip{align-self:flex-start;padding:4px 10px;border-radius:20px;background:var(--rail-chip);color:#A8CBB7;font-size:11px;font-weight:600}
.rail-user{display:flex;align-items:center;gap:9px}
.rail-user .who{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.rail-user .who b{font-size:12.5px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-user .who span{font-size:10.5px;color:var(--rail-dim)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:11.5px;font-weight:600;display:grid;place-items:center;flex-shrink:0}
.avatar.lg{width:38px;height:38px;font-size:13px}
.icon-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--rail-line);background:transparent;color:var(--rail-text);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:#1E3129;color:#fff}

.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{min-height:72px;padding:12px 32px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.topbar h1{font-size:21px;font-weight:700;letter-spacing:-.02em}
.topbar .sub{margin-top:2px;font-size:11.5px;color:var(--muted)}
.page{padding:22px 32px 40px;display:flex;flex-direction:column;gap:20px;flex:1 1 auto;min-width:0}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 16px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--sunken-2)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sm{min-height:32px;padding:0 12px;font-size:12px;border-radius:8px}
.btn.xs{min-height:30px;padding:0 11px;font-size:11.5px;border-radius:7px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--accent-deep)}
.btn.danger{border-color:var(--late-line);color:var(--late)}
.btn.danger:hover:not(:disabled){background:var(--late-soft)}
.btn.solid-danger{background:var(--late);border-color:var(--late);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover:not(:disabled){background:var(--accent-soft)}
.btn.block{width:100%}
.btn.icon{width:34px;min-height:34px;padding:0}

.field{width:100%;min-height:40px;padding:0 12px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);font-size:13.5px}
.field:focus{border-color:var(--accent)}
.field.on{border-color:var(--accent)}
.field.warn{border-color:#C0A97E;background:var(--run-tint)}
textarea.field{padding:8px 11px;min-height:auto;line-height:1.55;resize:vertical}
.lbl{display:block;font-size:11.5px;font-weight:600;color:var(--ink-mid);margin-bottom:5px}
.hint{margin-top:5px;font-size:11px;color:var(--muted)}
.hint.warn{color:var(--run)}
.hint.ok{color:var(--done)}
.search{position:relative;width:268px;max-width:100%}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .field{padding-left:34px}
.kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 5px;background:var(--surface)}

.seg{display:inline-flex;padding:3px;background:#E7ECE9;border-radius:9px;gap:3px;flex-wrap:wrap}
.seg button{padding:6px 13px;border:0;border-radius:7px;background:transparent;font-size:12.5px;font-weight:500;color:var(--idle);cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"],.seg button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(22,36,30,.1)}
.seg .n{font-family:var(--mono);color:var(--muted)}
.seg button[aria-pressed="true"] .n{color:var(--ink)}
.seg.lg button{min-height:44px;flex:1 1 0;border-radius:8px;font-size:13px}

.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 8px 0 11px;border-radius:7px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:11.5px;font-weight:500;color:var(--accent-deep);cursor:pointer}
.chip.static{cursor:default}
.chip.dashed{background:transparent;border:1px dashed var(--line-strong);color:var(--ink-mid)}
.url{font-family:var(--mono);font-size:11px;color:var(--muted);padding:5px 9px;background:#E9EEEB;border-radius:6px}

.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.sm{padding:2px 8px;font-size:10.5px}
.pill.done{background:var(--done-soft);color:var(--done)}
.pill.run{background:var(--run-soft);color:var(--run)}
.pill.idle{background:var(--idle-soft);color:var(--idle)}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.accent{background:var(--accent-soft);color:var(--accent-deep)}
.tag{font-family:var(--mono);padding:2px 7px;border-radius:5px;background:var(--sunken-2);font-size:10.5px;font-weight:600;color:var(--ink)}
.tag.dark{background:var(--ink);color:#fff;padding:3px 8px;border-radius:6px;font-size:11.5px}

.meter{display:block;height:6px;border-radius:4px;background:var(--track);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.meter.done>i{background:var(--done-bar)} .meter.run>i{background:var(--run-bar)} .meter.idle>i{background:var(--idle-bar)}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--track)}
.stack>i{display:block;height:100%}
.stack .d{background:var(--done-bar)} .stack .r{background:var(--run-bar)} .stack .i{background:var(--idle-bar)}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px}
.card.late{border-color:var(--late-line)}
.card.warn{border-color:var(--run-line)}
.tile{padding:14px 16px;min-height:98px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;gap:10px}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,111,83,.16)}
.tile .k{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600}
.tile .v{display:flex;align-items:baseline;gap:8px}
.tile .v b{font-size:30px;font-weight:700;letter-spacing:-.02em}
.tile .v span{font-size:11.5px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.cols{display:flex;gap:20px;align-items:flex-start}
.side{width:344px;flex:0 0 344px;display:flex;flex-direction:column;gap:18px}
.side.wide{width:392px;flex-basis:392px}
.panel-h{padding:14px 16px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.panel-h h2{font-size:13.5px;font-weight:600}
.sec-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:34px}
.sec-h h2{font-size:15px;font-weight:600}
.count{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* ---------- lists / rows ---------- */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:16px;padding:0 16px;min-height:80px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);color:inherit}
.row:hover{border-color:var(--line-strong);background:#FDFEFD}
.row.late{border-color:var(--late-line);background:var(--late-tint)}
.row .stripe{width:4px;height:44px;border-radius:3px;background:var(--track);flex-shrink:0}
.row.late .stripe{background:var(--late-bar)}
.row .who{display:flex;flex-direction:column;gap:4px;min-width:0}
.row .meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.row .title{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .pic{font-size:11.5px;color:var(--muted)}
.row .when{width:112px;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11px}
.row .when b{font-family:var(--mono);font-size:12px}
.row .prog{width:132px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.row .prog .bar{width:100%;display:flex;align-items:center;gap:7px}
.row .prog .bar b{font-family:var(--mono);font-size:11px;color:var(--ink-mid)}
.group-h{display:flex;align-items:center;gap:8px;min-height:24px;margin-top:4px}
.group-h .dot{width:7px;height:7px;border-radius:50%}
.group-h span{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.group-h .rule{flex:1;height:1px;background:var(--track)}
.add-row{min-height:56px;border:1px dashed var(--line-strong);border-radius:var(--r);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;color:var(--accent);background:transparent;cursor:pointer;width:100%}
.add-row:hover{background:var(--accent-soft)}

.list-h{display:flex;align-items:center;gap:16px;padding:0 16px;min-height:30px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.case-row{min-height:96px}
.case-row .spread{width:268px;flex-shrink:0;display:flex;flex-direction:column;gap:7px}
.case-row .spread .legend{display:flex;gap:12px;font-family:var(--mono);font-size:11px;color:var(--ink-mid)}
.case-row .ctx{width:122px;flex-shrink:0}
.case-row .pct{width:96px;flex-shrink:0;text-align:right;font-family:var(--mono);font-size:17px;font-weight:600}
.case-row .go{width:40px;flex-shrink:0;display:flex;justify-content:flex-end;color:var(--muted)}
.mini{display:flex;align-items:center;gap:11px;padding:11px 16px;border-top:1px solid var(--line-soft);color:inherit}
.mini:hover{background:var(--sunken)}
.mini .r{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.mini .r b{font-family:var(--mono);font-size:12px}
.mini .r .meter{width:58px;height:5px}

/* ---------- table ---------- */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.tbl{font-size:13px;table-layout:fixed}
.tbl thead tr{background:var(--sunken);border-bottom:1px solid var(--line)}
.tbl th{height:40px;text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 12px 0 0}
.tbl th:first-child{padding-left:16px}
.tbl th button{border:0;background:transparent;padding:4px 6px;margin-left:-6px;cursor:pointer;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-radius:6px}
.tbl th button:hover{background:var(--sunken-2);color:var(--ink)}
.tbl th button[data-on="1"]{color:var(--ink)}
.tbl tbody tr{border-bottom:1px solid var(--line-soft)}
.tbl tbody tr:last-child{border-bottom:0}
.tbl tbody tr:hover{background:var(--sunken)}
.tbl tbody tr.late{background:var(--late-tint)}
.tbl td{height:68px;padding:0 12px 0 0;vertical-align:middle}
.tbl td:first-child{padding-left:16px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tbl .t1{display:flex;align-items:center;gap:7px}
.tbl .t2{margin-top:3px;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .sp{display:flex;align-items:center;gap:8px}
.tbl .sp .meter{width:52px;height:5px}
.tbl .sp b{font-family:var(--mono);font-size:11px;color:var(--ink-mid)}
.tfoot{min-height:52px;padding:8px 16px;border-top:1px solid var(--line);background:var(--sunken);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pager{display:inline-flex;gap:4px}
.pager button{min-width:30px;height:30px;padding:0 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:12px;color:var(--ink-mid);cursor:pointer;display:grid;place-items:center}
.pager button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.pager button:disabled{color:#C3CCC8;cursor:not-allowed}

/* ---------- empty / status ---------- */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:48px 30px;text-align:center}
.empty .ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--sunken-2);color:var(--faint)}
.empty .ico.ok{background:var(--done-soft);color:var(--done)}
.empty .ico.bad{background:var(--late-soft);color:var(--late)}
.empty h2{font-size:16px;font-weight:700}
.empty p{max-width:460px;font-size:12.5px;line-height:1.65;color:var(--muted)}
.banner{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:9px;font-size:12px;line-height:1.55}
.banner.ok{background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent-deep)}
.banner.warn{background:var(--run-tint);border:1px solid var(--run-line);color:var(--run)}
.banner.bad{background:var(--late-soft);border:1px solid var(--late-line);color:var(--late)}
.banner svg{flex-shrink:0;margin-top:1px}
.skel{border-radius:var(--r);background:linear-gradient(90deg,var(--sunken-2) 25%,#E7ECE9 50%,var(--sunken-2) 75%);background-size:400% 100%;animation:sh 1.4s ease-in-out infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--accent);animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(22,36,30,.44);z-index:60;display:flex}
.scrim.center{align-items:center;justify-content:center;padding:24px}
.scrim.right{justify-content:flex-end}
.sheet{width:620px;max-width:100%;background:var(--surface);display:flex;flex-direction:column;height:100vh;box-shadow:-10px 0 40px rgba(22,36,30,.18)}
.sheet header{min-height:62px;padding:12px 20px 12px 24px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:12px}
.sheet .body{flex:1 1 auto;overflow-y:auto;padding:18px 24px;display:flex;flex-direction:column;gap:18px}
.sheet footer{min-height:76px;padding:14px 24px;border-top:1px solid var(--line);background:#FAFCFB;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ctx-strip{padding:14px 24px;background:#F5F8F6;border-bottom:1px solid var(--line-soft)}
.modal{width:470px;max-width:100%;background:var(--surface);border-radius:14px;box-shadow:0 24px 60px rgba(22,36,30,.3);padding:24px}
.dropzone{width:100%;min-height:84px;border:1px dashed var(--line-strong);border-radius:var(--r);background:#FAFCFB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;padding:12px}
.dropzone:hover{border-color:var(--accent);background:var(--accent-soft)}
.file{display:inline-flex;align-items:center;gap:7px;padding:6px 6px 6px 11px;border-radius:8px;background:var(--sunken-2);border:1px solid var(--line);font-size:11.5px;color:var(--ink-mid)}
.file button{width:20px;height:20px;border:0;background:transparent;border-radius:5px;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.file button:hover{background:var(--late-soft);color:var(--late)}
.menu{position:absolute;top:calc(100% + 6px);right:0;width:240px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 28px rgba(22,36,30,.14);padding:5px;z-index:40;display:flex;flex-direction:column}
.menu button{text-align:left;border:0;background:transparent;padding:9px 11px;border-radius:7px;font-size:12.5px;cursor:pointer}
.menu button:hover{background:var(--sunken-2)}
.menu button.bad{color:var(--late);font-weight:600}
.menu button.bad:hover{background:var(--late-soft)}
.menu hr{border:0;border-top:1px solid var(--line-soft);margin:5px 0}
#toast-root{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:12.5px;box-shadow:0 8px 24px rgba(22,36,30,.28);max-width:min(520px,92vw)}
.toast.bad{background:var(--late)}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:40px 20px}
.auth .logo{font-family:var(--sans);display:flex;align-items:center;gap:10px}
.auth .logo .rail-mark{width:34px;height:34px;border-radius:9px}
.auth .logo b{font-size:20px;font-weight:700;letter-spacing:-.02em}
.auth .kicker{margin:12px 0 26px;font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.auth .card{width:440px;max-width:100%;padding:26px 28px}
.auth h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
.auth .blurb{margin-top:6px;font-size:12.5px;line-height:1.6;color:var(--muted)}
.auth form{margin-top:20px;display:flex;flex-direction:column;gap:14px}
.auth .links{margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.auth .links button{border:0;background:transparent;padding:0 0 0 4px;font-size:12.5px;font-weight:600;color:var(--accent);cursor:pointer;text-decoration:underline}
.pw{position:relative}
.pw .field{padding-right:78px}
.pw button{position:absolute;right:5px;top:5px;height:30px;padding:0 10px;border:0;background:transparent;border-radius:7px;font-size:12px;font-weight:600;color:var(--accent);cursor:pointer}

/* ---------- wizard / steps ---------- */
.wiz{display:flex;min-height:0;flex:1 1 auto}
.wiz-side{width:286px;flex:0 0 286px;padding:22px 22px 22px 26px;background:var(--sunken);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;gap:26px}
.stepper li{display:flex;gap:12px}
.stepper .col{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.stepper .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);color:var(--faint);font-family:var(--mono);font-size:12px;font-weight:600;display:grid;place-items:center;cursor:pointer}
.stepper .dot[data-state="done"]{background:var(--accent);border-color:var(--accent);color:#fff}
.stepper .dot[data-state="now"]{border-color:var(--accent);color:var(--accent)}
.stepper .line{width:2px;flex:1;min-height:34px;background:var(--line-strong)}
.stepper .line.done{background:var(--accent)}
.stepper .txt{padding-bottom:16px}
.stepper .txt b{display:block;font-size:13px;font-weight:600}
.stepper .txt span{display:block;margin-top:3px;font-size:11.5px;line-height:1.5;color:var(--muted)}
.step-card{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.step-card.bad{border-color:var(--run-line)}
.step-card .head{display:flex;align-items:center;gap:10px}
.step-card .grid{margin-top:9px;display:grid;grid-template-columns:2.2fr 1.1fr 1fr;gap:9px}
.move{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.move button{width:22px;height:15px;padding:0;border:1px solid var(--line);border-radius:4px;background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--ink-mid)}
.move button:disabled{color:#C3CCC8;cursor:not-allowed}
.num{width:30px;height:30px;border-radius:8px;font-family:var(--mono);font-size:12.5px;font-weight:600;display:grid;place-items:center;flex-shrink:0;background:var(--sunken-2)}
.num.done{background:var(--done-soft);color:var(--done)} .num.run{background:var(--run-soft);color:var(--run)}
.num.idle{background:var(--idle-soft);color:var(--idle)} .num.late{background:var(--late-soft);color:var(--late)}
.step-item{display:flex;gap:14px;padding:14px 16px;min-height:104px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.step-item.late{border-color:var(--late-line)}
.step-item .desc{flex:1 1 auto;min-width:0}
.step-item .desc h3{font-size:13.5px;font-weight:600}
.step-item .desc p{margin-top:4px;font-size:12px;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.step-item .desc .foot{margin-top:7px;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.step-item .state{width:150px;flex-shrink:0;display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.step-item .state .bar{width:100%;display:flex;align-items:center;gap:7px}
.step-item .state .bar b{font-family:var(--mono);font-size:11px;color:var(--ink-mid)}

/* ---------- context / dl ---------- */
.dl{display:flex;flex-direction:column;gap:12px}
.dl dt{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dl dd{margin-top:4px;font-size:12.5px;line-height:1.55}
.kv{display:flex;align-items:baseline;gap:10px}
.kv dt{width:96px;flex-shrink:0;font-size:11.5px;color:var(--muted);text-transform:none;letter-spacing:0}
.kv dd{margin:0;font-size:12.5px}

/* ---------- foundations / flow ---------- */
.swatches{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.swatch i{display:block;height:52px;border-radius:8px;border:1px solid var(--line)}
.swatch b{display:block;margin-top:6px;font-size:11px;font-weight:600}
.swatch span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.type-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-top:12px;border-top:1px solid var(--line-soft)}
.type-row:first-child{padding-top:0;border-top:0}
.type-row span:last-child{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.lane{display:flex;align-items:stretch;gap:12px}
.lane .k{width:74px;flex-shrink:0;display:flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.lane .k.after{color:var(--accent-deep)}
.lane .steps{flex:1;display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.lane .steps>span{flex:1 1 140px;padding:9px 11px;border-radius:8px;background:var(--sunken-2);border:1px solid #E0E6E3;font-size:11.5px;line-height:1.4;color:var(--ink-mid);display:flex;align-items:center}
.lane.after .steps>span{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-deep)}
.lane .steps>i{display:flex;align-items:center;color:var(--line-strong);flex-shrink:0}

/* ---------- export document ---------- */
.doc-wrap{background:#E9EEEB;padding:22px 24px 40px;display:flex;justify-content:center}
.doc{width:100%;max-width:900px;background:#fff;border:1px solid #D7DEDA;box-shadow:0 2px 14px rgba(22,36,30,.08);padding:46px 52px}
.doc h2{margin-top:22px;font-size:17px;font-weight:700;line-height:1.4}
.doc h3{margin:26px 0 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.doc p,.doc li{font-size:12.5px;line-height:1.75}
.doc .head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.doc table{font-size:11.5px;border:1px solid #C9D2CE}
.doc table th,.doc table td{border:1px solid #C9D2CE;padding:8px 9px;text-align:left;vertical-align:top;height:auto}
.doc table thead tr{background:var(--canvas)}
.doc .idt th{border:0;padding:6px 12px 6px 0;width:190px;font-weight:600;color:var(--muted);vertical-align:top}
.doc .idt td{border:0;padding:6px 0;line-height:1.55}
.doc .sign{margin-top:40px;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.doc .sign .rule{height:62px}
.doc .sign b{display:block;padding-top:6px;border-top:1px solid var(--ink);font-size:12.5px;font-weight:600}
.doc ul{padding-left:20px;list-style:disc}

/* ---------- mobile ---------- */
.tabbar{display:none}
@media (max-width:900px){
  .rail{display:none}
  .shell{flex-direction:column}
  .topbar{padding:12px 16px;min-height:60px;gap:12px}
  .topbar h1{font-size:19px}
  .page{padding:16px 16px 84px;gap:16px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{min-height:78px;padding:11px 13px}
  .tile .v b{font-size:24px}
  /* Stacked columns size to content unless told otherwise, so a wide child
     (a segmented control, a long row) would push the page sideways. */
  .cols{flex-direction:column;align-items:stretch}
  .cols>*{width:100%;min-width:0;max-width:100%}
  .side,.side.wide{width:100%;flex-basis:auto}
  .search{width:100%}
  .sec-h .spacer{display:none}
  .seg{width:100%}
  .seg button{flex:1 1 auto}
  .row,.card,.tbl-wrap,.step-item,.step-card{max-width:100%}
  .row .title{white-space:normal}
  .row{flex-wrap:wrap;min-height:0;padding:13px 14px;gap:8px;align-items:flex-start}
  .row .stripe,.row .go{display:none}
  .row .who{width:100%}
  .row .when{width:auto;align-items:flex-start;flex-direction:row;gap:8px;order:3}
  .row .prog{width:100%;flex-direction:row;align-items:center;gap:10px;order:4}
  .row .prog .bar{flex:1}
  .row>.btn{order:5;margin-left:auto}
  .case-row .spread,.case-row .ctx,.case-row .pct{width:100%;flex-basis:auto;text-align:left}
  .list-h{display:none}
  .tbl-wrap{border:0;background:transparent;overflow:visible}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:auto}
  .tbl tbody tr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;padding:12px 14px}
  .tbl tbody tr.late{border-color:var(--late-line)}
  .tbl td{height:auto;padding:0;margin-top:6px}
  .tbl td:first-child{display:none}
  .tbl td[data-l]::before{content:attr(data-l);display:block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .tbl .t2{white-space:normal}
  .tfoot{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-top:8px}
  .step-item{flex-wrap:wrap;min-height:0}
  .step-item .state{width:100%;flex-direction:row;align-items:center;gap:10px}
  .step-item .state .bar{flex:1}
  .step-item>.btn{width:100%}
  .sheet{width:100%;height:100vh}
  .scrim.right{align-items:stretch}
  .wiz{flex-direction:column}
  .wiz-side{width:100%;flex-basis:auto;border-right:0;border-bottom:1px solid var(--line-soft);gap:18px}
  .step-card .grid{grid-template-columns:1fr}
  .swatches{grid-template-columns:repeat(3,minmax(0,1fr))}
  .doc-wrap{padding:12px 12px 40px}
  .doc{padding:26px 22px}
  .doc .sign{grid-template-columns:1fr}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:64px;background:var(--surface);border-top:1px solid var(--line);z-index:50}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:500;color:var(--muted)}
  .tabbar a[aria-current="page"]{color:var(--accent);font-weight:600}
  #toast-root{bottom:80px}
}
@media (max-width:560px){
  .tiles{grid-template-columns:1fr 1fr}
  .topbar .btn{flex:1 1 auto}
}

/* ---------- print ---------- */
@media print{
  .rail,.topbar,.tabbar,#toast-root,.no-print{display:none !important}
  body,.doc-wrap{background:#fff}
  .doc{box-shadow:none;border:0;max-width:none;padding:0}
  .page{padding:0}
  @page{margin:18mm}
}

/* State, derivations and every mutation the prototype supports.
   The spreadsheet is the model here: items carry stored values, and anything
   that can be derived (Terlambat, progress totals) is derived on read. */
(function (IAP) {
  var KEY = 'iap-prototype-v1';
  var MONTHS = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  var MONTHS_LONG = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  var DAYS = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

  function clone(v) { return JSON.parse(JSON.stringify(v)); }

  /* ---------- dates ---------- */
  function fmt(iso) {
    if (!iso) return '';
    var p = iso.split('-');

    var rel, tone;
    if (done) { rel = it.actual ? 'selesai ' + fmt(it.actual) : 'selesai'; tone = 'done'; }
    else if (d === null) { rel = 'tanpa tanggal target'; tone = 'idle'; }
    else if (d < 0) { rel = 'terlambat ' + Math.abs(d) + ' hari'; tone = 'late'; }
    else if (d === 0) { rel = 'jatuh tempo hari ini'; tone = 'run'; }
    else if (d <= 7) { rel = d + ' hari lagi'; tone = 'run'; }
    else { rel = d + ' hari lagi'; tone = 'idle'; }
    return {
      item: it, overdue: overdue, daysToTarget: d, rel: rel, tone: tone,
      dueSoon: !done && d !== null && d >= 0 && d <= 7,
      noProof: done && it.evidence.length === 0,

      if (d.dueSoon) t.dueSoon++;

      if (saved.items) S.items = saved.items;
      if (saved.cases) S.cases = saved.cases;
      if (saved.users) S.users = saved.users;

            '</div>';
        }).join('') + '</dl>';

    var evidence = [];

      right: '<a class="btn" href="#/ekspor/' + c.iapId + '">' + I.upload(14) + 'Ekspor</a>' +
        '<button type="button" class="btn" data-act="ctx-edit">' + (d.ctxEdit ? 'Selesai mengubah' : 'Ubah konteks') + '</button>' +
        '<span style="position:relative;display:inline-flex">' +

          (d.menu ? '<span class="menu">' +
            '<button type="button" data-act="menu-close">Duplikat sebagai kasus baru</button>' +
            '<button type="button" data-act="menu-close">Buka di Google Sheet</button><hr>' +
            '<button type="button" class="bad" data-act="ask-delete">Hapus kasus — ' + items.length + ' baris</button></span>' : '') +

    }) +
    '<div class="page" id="main">' + h.offlineBanner() +
      '<section class="card" style="padding:18px 20px;display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap">' +
        '<div class="grow"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
          '<span class="tag dark">' + c.iapId + '</span>' +
          (t.overdue ? '<span class="pill late">' + I.warn(11) + ' ' + t.overdue + ' langkah terlambat</span>' : '<span class="pill done">sesuai rencana</span>') +
        '</div>' +
        '<h2 style="margin-top:8px;font-size:20px;font-weight:700;letter-spacing:-.02em">' + esc(c.title) + '</h2>' +
        '<p style="margin-top:5px;font-size:12.5px;color:var(--muted)">' + esc(c.stationText) +
          (c.context.efektif ? ' · tanggal efektif ' + esc(c.context.efektif) : ' · tanggal efektif belum ditetapkan') +

        '<div style="width:300px;display:flex;flex-direction:column;gap:8px">' +
          '<div style="display:flex;align-items:baseline;justify-content:space-between"><span style="font-size:11.5px;font-weight:600;color:var(--muted)">Progres kasus</span>' +
          '<b class="mono" style="font-size:20px;font-weight:700">' + t.pctClosed + '%</b></div>' +
          stack(t) +
          '<span class="mono" style="display:flex;gap:14px;font-size:11px;color:var(--ink-mid)"><span>' + t.closed + ' selesai</span><span>' + t.inProgress + ' berjalan</span><span>' + t.open + ' belum</span></span>' +
        '</div>' +
      '</section>' +
      '<div class="cols">' +
        '<section class="grow">' +
          '<div class="sec-h"><h2>Matriks langkah perbaikan</h2><span class="count">' + items.length + ' langkah</span>' +
            '<span class="spacer"></span>' +
            seg([{ label: 'Urutan langkah', on: d.sort === 'urutan', act: 'detail-sort', val: 'urutan' },
                 { label: 'Paling mendesak', on: d.sort === 'mendesak', act: 'detail-sort', val: 'mendesak' }]) +
          '</div>' +
          '<div class="rows" style="margin-top:12px">' + steps +
            '<button type="button" class="add-row" data-act="add-step">' + I.plus(15) + 'Tambah langkah ke kasus ini</button>' +
          '</div>' +
          '<p style="margin-top:12px;font-size:11.5px;color:var(--muted)" role="status">Menampilkan ' + shown.length + ' dari ' + items.length + ' langkah. ' +
            (items.length > 5 ? '<button type="button" class="btn ghost xs" data-act="detail-all">' + (d.showAll ? 'Tampilkan lebih sedikit' : 'Tampilkan semua') + '</button>' : '') + '</p>' +
        '</section>' +
        '<aside class="side wide">' +
          '<section class="card" style="padding:16px 18px">' +

              '<h2 style="font-size:13.5px;font-weight:600">Konteks dokumen IAP</h2>' +

            ctxBody +

            '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px">' +
              '<h2 style="font-size:13.5px;font-weight:600">Bukti kasus</h2><span class="count">' + evidence.length + ' berkas</span></div>' +
            (evidence.length
              ? '<div style="display:flex;flex-wrap:wrap;gap:7px">' + evidence.slice(0, 6).map(function (n) { return h.fileChip(n); }).join('') +
                (evidence.length > 6 ? '<span class="file">+' + (evidence.length - 6) + ' lainnya</span>' : '') + '</div>'
              : '<p style="font-size:11.5px;color:var(--run)">Belum ada berkas terlampir pada kasus ini.</p>') +
            '<p style="margin-top:12px;font-size:11.5px;line-height:1.6;color:var(--muted)">Bukti dilampirkan per langkah. Buka satu langkah lalu unggah dari panel Perbarui.</p>' +
          '</section>' +
        '</aside>' +
      '</div></div>';
  }

  /* ---------- Tracker ---------- */
  var VIEWS = [
    { key: 'semua', label: 'Semua' },
    { key: 'perlu', label: 'Perlu tindakan' },
    { key: 'terlambat', label: 'Terlambat' },
    { key: 'saya', label: 'Milik saya' },
    { key: 'selesai', label: 'Selesai' }
  ];
  function matchView(it, key) {
    var d = S.derive(it);
    if (key === 'semua') return true;
    if (key === 'terlambat') return d.overdue;
    if (key === 'saya') return S.isMine(it);
    if (key === 'selesai') return it.status === 'Selesai';
    return it.status !== 'Selesai' && d.daysToTarget !== null && d.daysToTarget <= 7;
  }

  function tracker() {
    var f = U.tracker;
    var all = S.visibleItems();
    var filtered = all.filter(function (it) {
      if (!matchView(it, f.view)) return false;
      if (f.q) {
        var hay = (it.step + ' ' + it.action + ' ' + it.pic + ' ' + it.iapId + ' langkah ' + it.stepNo).toLowerCase();
        if (hay.indexOf(f.q.toLowerCase()) === -1) return false;
      }
      return true;
    });

    var dir = f.dir === 'asc' ? 1 : -1;
    var RANK = { 'Belum Dimulai': 0, 'Sedang Berjalan': 1, 'Selesai': 2 };
    filtered.sort(function (a, b) {
      var av, bv;
      if (f.sort === 'no') { av = a.no; bv = b.no; }
      else if (f.sort === 'iap') { av = a.iapId + String(a.stepNo).padStart(3, '0'); bv = b.iapId + String(b.stepNo).padStart(3, '0'); }
      else if (f.sort === 'pic') { av = a.pic; bv = b.pic; }
      else if (f.sort === 'status') { av = RANK[a.status]; bv = RANK[b.status]; }
      else { av = a.target || '9999'; bv = b.target || '9999'; }
      if (av < bv) return -dir;
      if (av > bv) return dir;
      return a.no - b.no;
    });

    var pageCount = Math.max(1, Math.ceil(filtered.length / f.size));
    var page = Math.min(f.page, pageCount);
    var start = (page - 1) * f.size;
    var slice = filtered.slice(start, start + f.size);

    function th(key, label, w) {
      var on = f.sort === key;
      return '<th' + (w ? ' style="width:' + w + '"' : '') + ' scope="col" aria-sort="' + (on ? (f.dir === 'asc' ? 'ascending' : 'descending') : 'none') + '">' +
        '<button type="button" data-act="trk-sort" data-val="' + key + '" data-on="' + (on ? 1 : 0) + '">' + esc(label) +
        (on ? ' ' + (f.dir === 'asc' ? I.up(11) : I.down(11)) : '') + '</button></th>';
    }

    var chips = [];
    if (f.q) chips.push({ label: 'kata kunci “' + f.q + '”', act: 'trk-clear-q' });
    if (f.view !== 'semua') chips.push({ label: 'tampilan: ' + VIEWS.filter(function (v) { return v.key === f.view; })[0].label.toLowerCase(), act: 'trk-clear-view' });

    var body = slice.map(function (it) {
      var x = S.derive(it);
      var c = S.caseOf(it.iapId);
      return '<tr class="' + (x.overdue ? 'late' : '') + '">' +
        '<td>' + it.no + '</td>' +
        '<td data-l="Kasus & langkah"><div class="t1"><span class="tag">' + it.iapId + '</span>' +
          '<span style="font-size:10.5px;color:var(--muted)">Langkah ' + it.stepNo + ' · ' + esc(c.stations.join(' & ')) + '</span></div>' +
          '<div class="t2">' + esc(it.step) + '</div></td>' +
        '<td data-l="PIC" style="font-size:12px;color:var(--ink-mid)">' + esc(it.pic || '—') + '</td>' +
        '<td data-l="Target"><div class="mono" style="font-size:12px;font-weight:600;color:' + (x.overdue ? 'var(--late)' : 'var(--ink)') + '">' + esc(x.targetText || '—') + '</div>' +
          '<div style="margin-top:2px;font-size:10.5px;color:var(--' + (x.tone === 'late' ? 'late' : x.tone === 'run' ? 'run' : x.tone === 'done' ? 'done' : 'muted') + ')">' + esc(x.rel) + '</div></td>' +
        '<td data-l="Status & progres"><div class="sp">' + pill(it, true) + meter(it.progress, x.statusKey) + '<b>' + it.progress + '%</b></div></td>' +
        '<td data-l="Bukti" style="font-size:11.5px;' + (x.noProof ? 'color:var(--run);font-weight:600' : 'color:var(--ink-mid)') + '">' +
          (it.evidence.length ? it.evidence.length + ' berkas' : (x.noProof ? 'kosong' : '—')) + '</td>' +
        '<td data-l="Aksi" style="text-align:right"><a class="btn xs' + (x.overdue ? ' primary' : '') + '" href="#/langkah/' + it.id + '">Perbarui</a></td>' +
      '</tr>';
    }).join('');

    var pages = [];
    for (var i = 1; i <= pageCount; i++) {
      pages.push('<button type="button" data-act="trk-page" data-val="' + i + '" aria-current="' + (i === page) + '">' + i + '</button>');
    }

    return IAP.views.topbar({
      title: 'Tracker',
      sub: all.length + ' item aksi dari ' + S.visibleCases().length + ' kasus IAP',
      right: h.searchBox('trk-q', f.q, 'Cari langkah, PIC, ID…') +
        '<button type="button" class="btn primary" data-act="trk-new">' + I.plus(15) + 'Item Aksi Baru</button>'
    }) +
    '<div class="page" id="main">' + h.offlineBanner() +
      '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
        seg(VIEWS.map(function (v) {
          return { label: v.label, on: f.view === v.key, act: 'trk-view', val: v.key, n: all.filter(function (it) { return matchView(it, v.key); }).length };
        })) +
        '<span class="spacer"></span>' +
        '<span class="url">' + esc('/tracker?view=' + f.view + (f.q ? '&q=' + f.q.replace(/\s+/g, '+') : '')) + '</span>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
        '<span style="font-size:11.5px;color:var(--muted)">Filter:</span>' +
        (chips.length ? chips.map(function (c) {
          return '<button type="button" class="chip" data-act="' + c.act + '">' + esc(c.label) + I.close(10) + '</button>';
        }).join('') : '<span style="font-size:11.5px;color:var(--faint)">belum ada — ketik di kotak cari atau pilih tampilan</span>') +
        '<span class="spacer"></span>' +
        '<button type="button" class="btn ghost sm" data-act="trk-clear-all"' + (chips.length ? '' : ' disabled') + '>Hapus semua filter</button>' +
      '</div>' +
      '<div class="tbl-wrap">' +
        (slice.length ? '<table class="tbl"><caption class="sr">Seluruh item aksi IAP dengan PIC, tanggal target, status dan bukti</caption>' +
          '<thead><tr>' + th('no', 'No', '56px') + th('iap', 'Kasus & langkah perbaikan') + th('pic', 'PIC', '148px') +
          th('target', 'Target', '140px') + th('status', 'Status & progres', '178px') +
          '<th scope="col" style="width:104px">Bukti</th><th scope="col" style="width:108px;text-align:right">Aksi</th></tr></thead>' +
          '<tbody>' + body + '</tbody></table>'
        : h.emptyState({
            title: 'Tidak ada item yang cocok',
            body: f.q ? 'Tidak ada langkah yang memuat “' + esc(f.q) + '” pada tampilan ini. Coba kata kunci lain atau pindah ke tampilan Semua.'
              : 'Tampilan ini sedang kosong — tidak ada satu pun item yang memenuhi kriterianya.',
            action: '<button type="button" class="btn primary" data-act="trk-clear-all">Hapus semua filter</button>'
          })) +
        '<div class="tfoot"><p style="font-size:11.5px;color:var(--muted)" role="status">Menampilkan ' +
          (filtered.length ? (start + 1) + '–' + (start + slice.length) : 0) + ' dari ' + filtered.length + ' item yang cocok</p>' +
          '<span class="spacer"></span>' +
          '<label for="trk-size" style="font-size:11.5px;color:var(--muted)">Baris</label>' +
          '<select class="field" id="trk-size" style="width:auto;min-height:30px" data-model="trk-size">' +
            [10, 25, 50, 999].map(function (n) { return '<option value="' + n + '"' + (f.size === n ? ' selected' : '') + '>' + (n === 999 ? 'Semua' : n) + '</option>'; }).join('') +
          '</select>' +
          '<span class="pager"><button type="button" data-act="trk-page" data-val="' + (page - 1) + '"' + (page <= 1 ? ' disabled' : '') + ' aria-label="Halaman sebelumnya">' + I.left(14) + '</button>' +
          pages.join('') +
          '<button type="button" data-act="trk-page" data-val="' + (page + 1) + '"' + (page >= pageCount ? ' disabled' : '') + ' aria-label="Halaman berikutnya">' + I.right(14) + '</button></span>' +
        '</div>' +
      '</div></div>';
  }

  /* ---------- Pengguna ---------- */
  function admin() {
    var a = U.admin;
    var st = S.state;
    var hit = function (s) { return !a.q || s.toLowerCase().indexOf(a.q.toLowerCase()) !== -1; };
    var active = st.users.filter(function (u) { return u.active; });
    var inactive = st.users.filter(function (u) { return !u.active; });
    var pending = st.pending.filter(function (p) { return hit(p.name + ' ' + p.email + ' ' + p.branch); });

    var tabs = [
      { key: 'menunggu', label: 'Menunggu persetujuan', n: st.pending.length },
      { key: 'aktif', label: 'Aktif', n: active.length },
      { key: 'nonaktif', label: 'Nonaktif', n: inactive.length }
    ];

    var branchOpts = function (sel) {
      return IAP.BRANCHES.map(function (b) {
        return '<option value="' + b.code + '"' + (sel === b.code ? ' selected' : '') + '>' + b.code + (b.code === 'PUSAT' ? ' — seluruh cabang' : ' — ' + b.hub) + '</option>';
      }).join('');
    };

    var body;
    if (a.tab === 'menunggu') {
      body = '<h2 style="font-size:14px;font-weight:600">Menunggu persetujuan Anda</h2>' +
        '<div class="rows">' + (pending.length ? pending.map(function (p) {
          return '<article class="row card' + (p.flag ? ' warn' : '') + '" style="min-height:74px">' +
            '<span class="avatar lg" style="' + (p.flag ? 'background:var(--run-soft);color:var(--run)' : 'background:var(--sunken-2);color:var(--ink-mid)') + '">' + esc(h.initials(p.name)) + '</span>' +
            '<span class="who grow"><b style="font-size:13.5px">' + esc(p.name) + '</b>' +
              '<span style="font-size:11.5px;color:' + (p.flag ? 'var(--run)' : 'var(--muted)') + '">' + esc(p.email) + ' · ' + (p.flag ? 'surel di luar domain gapura.id' : 'mendaftar ' + esc(p.since)) + '</span></span>' +
            '<span style="display:flex;flex-direction:column;gap:4px"><label class="lbl" style="margin:0" for="ap-' + p.id + '">Cabang yang diminta</label>' +
              '<select class="field" id="ap-' + p.id + '" style="min-height:34px;width:auto" data-model="pending-branch" data-id="' + p.id + '">' + branchOpts(p.branch) + '</select></span>' +
            '<span style="display:flex;flex-direction:column;gap:4px"><label class="lbl" style="margin:0" for="ar-' + p.id + '">Peran</label>' +
              '<select class="field" id="ar-' + p.id + '" style="min-height:34px;width:auto" data-model="pending-role" data-id="' + p.id + '">' +
                '<option value="user"' + (p.role === 'user' ? ' selected' : '') + '>Pengguna cabang</option>' +
                '<option value="admin"' + (p.role === 'admin' ? ' selected' : '') + '>Admin</option></select></span>' +
            '<span style="display:flex;gap:8px;align-self:flex-end">' +
              '<button type="button" class="btn danger sm" data-act="user-reject" data-id="' + p.id + '">Tolak</button>' +
              '<button type="button" class="btn primary sm" data-act="user-approve" data-id="' + p.id + '">Setujui</button></span>' +
          '</article>';
        }).join('') : '<div class="card">' + h.emptyState({
          kind: 'ok', icon: I.check(24), title: 'Antrean persetujuan kosong',
          body: 'Setiap pendaftar sudah ditindak. Akun baru muncul di sini segera setelah seseorang mendaftar lewat halaman Daftar.'
        }) + '</div>') + '</div>' +
        (a.log ? '<div class="banner ok">' + I.check(15) +
          '<div class="grow">' + esc(a.log.approved
            ? a.log.p.name + ' disetujui sebagai ' + (a.log.p.role === 'admin' ? 'Admin' : 'pengguna cabang ' + a.log.p.branch) + '.'
            : 'Pendaftaran ' + a.log.p.name + ' ditolak.') + '</div>' +
          '<button type="button" class="btn xs" data-act="user-undo">Urungkan</button></div>' : '');
    } else {
      var source = (a.tab === 'nonaktif' ? inactive : active).filter(function (u) { return hit(u.name + ' ' + u.email + ' ' + u.branch); });
      body = '<h2 style="font-size:14px;font-weight:600">' + (a.tab === 'nonaktif' ? 'Akun nonaktif' : 'Akun aktif') + '</h2>' +
        '<div class="tbl-wrap">' + (source.length
          ? '<table class="tbl"><caption class="sr">Daftar akun dengan cabang, peran dan waktu masuk terakhir</caption>' +
            '<thead><tr><th scope="col">Nama</th><th scope="col" style="width:250px">Surel</th><th scope="col" style="width:150px">Cabang</th>' +
            '<th scope="col" style="width:148px">Peran</th><th scope="col" style="width:160px">Masuk terakhir</th>' +
            '<th scope="col" style="width:130px;text-align:right">Aksi</th></tr></thead><tbody>' +
            source.map(function (u) {
              return '<tr><td style="font-weight:500;color:var(--ink);font-family:var(--sans)">' + esc(u.name) + '</td>' +
                '<td data-l="Surel" style="font-size:12px;color:var(--ink-mid)">' + esc(u.email) + '</td>' +
                '<td data-l="Cabang"><span class="pill sm ' + (u.branch === 'PUSAT' ? 'accent' : 'idle') + '">' + esc(u.branch) + '</span></td>' +
                '<td data-l="Peran" style="font-size:12px;color:var(--ink-mid)">' + (u.role === 'admin' ? 'Admin' : 'Pengguna cabang') + '</td>' +
                '<td data-l="Masuk terakhir" class="mono" style="font-size:11.5px;color:var(--muted)">' + esc(u.seen) + '</td>' +
                '<td data-l="Aksi" style="text-align:right"><button type="button" class="btn xs' + (u.active ? ' danger' : '') + '" data-act="user-toggle" data-id="' + u.id + '">' +
                  (u.active ? 'Nonaktifkan' : 'Aktifkan') + '</button></td></tr>';
            }).join('') + '</tbody></table>'
          : h.emptyState({ title: 'Tidak ada akun di sini', body: 'Coba kata kunci lain, atau pindah ke tab lain.' })) + '</div>';
    }

    return IAP.views.topbar({
      title: 'Pengguna',
      sub: st.users.length + ' akun · ' + st.pending.length + ' menunggu persetujuan',
      right: h.searchBox('adm-q', a.q, 'Cari nama, surel atau cabang…')
    }) +
    '<div class="page" id="main">' + h.offlineBanner() +
      seg(tabs.map(function (t) { return { label: t.label, on: a.tab === t.key, act: 'adm-tab', val: t.key, n: t.n }; })) +
      body +
    '</div>';
  }

  IAP.views.caseDetail = caseDetail;
  IAP.views.tracker = tracker;
  IAP.views.admin = admin;
})(window.IAP);

/* Wizard, update sheet, export document, design system, flow map and overlays. */
(function (IAP) {
  var S = IAP.store, I = IAP.icon, U = IAP.ui, h = IAP.h;
  var esc = h.esc, meter = h.meter, seg = h.seg;

  /* ---------- panel: perbarui langkah ---------- */
  function sheet() {
    var sh = U.sheet;
    if (!sh) return '';
    var it = S.itemById(sh.id);
    if (!it) return '';
    var c = S.caseOf(it.iapId);
    var dr = sh.draft;
    var isDone = dr.status === 'Selesai', isIdle = dr.status === 'Belum Dimulai', isRun = dr.status === 'Sedang Berjalan';
    var progress = isDone ? 100 : isIdle ? 0 : dr.progress;
    var key = isDone ? 'done' : isIdle ? 'idle' : 'run';
    var missingDate = isDone && !dr.actual;
    var x = S.derive(it);

    var hint = 'Progres bebas diisi 1–99%. Tanggal selesai aktual boleh menunggu.';
    var hintCls = '';
    if (isIdle) hint = 'Progres dikunci 0%. Item ini tetap dihitung terlambat bila tanggal target sudah lewat.';
    if (isDone) { hint = 'Progres otomatis 100% dan tanggal selesai aktual menjadi wajib.'; hintCls = ' ok'; }

    var blocked = missingDate || S.state.offline;
    var saveLabel = S.state.offline ? 'Tidak ada sambungan' : missingDate ? 'Lengkapi tanggal dulu' : 'Simpan';

    return '<div class="scrim right" data-act="sheet-close-bg"><section class="sheet" role="dialog" aria-modal="true" aria-label="Perbarui langkah">' +
      '<header><div class="grow"><h1 style="font-size:16px;font-weight:700">Perbarui langkah</h1>' +
        '<p style="margin-top:2px;font-size:11.5px;color:var(--muted)"><span class="mono" style="font-weight:600;color:var(--ink-mid)">' + it.iapId + '</span> · Langkah ' + it.stepNo + ' dari ' + S.itemsOf(it.iapId).length + ' · ' + esc(c.stations.join(' & ')) + '</p></div>' +
        '<span class="pill ' + key + '">' + esc(dr.status) + '</span>' +
        '<button type="button" class="btn icon" data-act="sheet-close" aria-label="Tutup panel">' + I.close(15) + '</button></header>' +
      '<div class="ctx-strip"><h2 style="font-size:13.5px;font-weight:600">' + esc(it.step) + '</h2>' +
        '<p style="margin-top:5px;font-size:12px;line-height:1.55;color:var(--muted)">' + esc(it.action) + '</p></div>' +
      (sh.saved ? '<div class="banner ok" style="margin:14px 24px 0">' + I.check(16) + '<div class="grow">' + esc(sh.saved) + '</div>' +
        '<button type="button" class="btn xs" data-act="sheet-dismiss">Tutup</button></div>' : '') +
      (S.state.offline ? '<div class="banner warn" style="margin:14px 24px 0">' + I.offline(15) +
        '<div class="grow">Sambungan terputus. Isian Anda aman di layar ini, tetapi belum bisa ditulis ke spreadsheet.</div>' +
        '<button type="button" class="btn xs" data-act="offline-off">Sambungkan</button></div>' : '') +
      '<div class="body">' +
        '<fieldset style="border:0;padding:0;margin:0"><legend class="lbl" style="padding:0">Status</legend>' +
          '<div class="seg lg">' + ['Belum Dimulai', 'Sedang Berjalan', 'Selesai'].map(function (s) {
            return '<button type="button" aria-pressed="' + (dr.status === s) + '" data-act="sheet-status" data-val="' + esc(s) + '">' + esc(s) + '</button>';
          }).join('') + '</div>' +
          '<p class="hint' + hintCls + '" style="margin-top:8px">' + esc(hint) + '</p></fieldset>' +

        '<div><div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px">' +
          '<label class="lbl" style="margin:0" for="sh-progress">Progres</label>' +
          '<b class="mono" style="font-size:17px;font-weight:700;color:var(--' + (isDone ? 'done' : isIdle ? 'idle' : 'run') + ')">' + progress + '%</b></div>' +
          '<input id="sh-progress" type="range" min="0" max="100" step="5" value="' + progress + '" data-model="sh-progress"' + (isRun ? '' : ' disabled') + ' style="width:100%">' +
          '<div style="margin-top:4px">' + meter(progress, key) + '</div></div>' +

        '<div><label class="lbl" for="sh-actual" style="display:flex;align-items:center;gap:7px">Tanggal selesai aktual' +
          '<span class="pill sm ' + (isDone ? 'late' : 'idle') + '">' + (isDone ? 'Wajib' : 'Opsional') + '</span></label>' +
          '<input class="field' + (missingDate ? ' warn' : isDone ? ' on' : '') + '" id="sh-actual" type="date" value="' + esc(dr.actual) + '" data-model="sh-actual"' + (isDone ? '' : ' disabled') + '>' +
          '<p class="hint' + (missingDate ? ' warn' : '') + '">' + (missingDate
            ? 'Isi tanggal ini sebelum menyimpan — langkah Selesai tanpa tanggal realisasi ditolak.'
            : isDone ? 'Ditulis ke kolom M sebagai teks Indonesia, contoh ' + esc(S.fmt(IAP.TODAY)) + '.'
            : 'Aktif setelah langkah ini ditandai Selesai.') + '</p></div>' +

        '<div><span class="lbl">Bukti pelaksanaan</span>' +
          '<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px">' +
            (it.evidence.length ? it.evidence.map(function (n, i) { return h.fileChip(n, 'ev-remove', i); }).join('')
              : '<span style="font-size:11.5px;color:' + (isDone ? 'var(--run)' : 'var(--muted)') + '">' +
                (isDone ? 'Langkah selesai sebaiknya punya minimal satu bukti.' : 'Belum ada lampiran.') + '</span>') +
          '</div>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">' +
            '<button type="button" class="btn primary" data-act="ev-add" data-val="foto">' + I.camera(16) + 'Ambil Foto</button>' +
            '<button type="button" class="btn" data-act="ev-add" data-val="berkas">' + I.upload(16) + 'Pilih Berkas</button></div>' +
          '<p class="hint">Diunggah ke folder Drive kasus dengan nama <span class="mono">' + esc(it.iapId + '_' + (it.target || '').replace(/-/g, '') + '_' + c.stations[0] + '_Langkah-' + it.stepNo) + '</span>.</p></div>' +

        '<div style="border-top:1px solid var(--line-soft);padding-top:14px">' +
          '<button type="button" class="btn ghost" style="padding:0;min-height:30px" data-act="sheet-details" aria-expanded="' + sh.details + '">' +
            '<span style="display:flex;transform:rotate(' + (sh.details ? 90 : 0) + 'deg)">' + I.right(14) + '</span>Ubah detail langkah — PIC, linimasa, tanggal target</button>' +
          (sh.details
            ? '<div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:11px">' +
                '<div style="grid-column:span 2"><label class="lbl" for="sh-pic">PIC (pemilik langkah)</label>' +
                  '<input class="field" id="sh-pic" type="text" value="' + esc(dr.pic) + '" data-model="sh-pic"></div>' +
                '<div><label class="lbl" for="sh-timeline">Linimasa</label>' +
                  '<input class="field" id="sh-timeline" type="text" value="' + esc(dr.timeline) + '" data-model="sh-timeline"></div>' +
                '<div><label class="lbl" for="sh-target">Tanggal target</label>' +
                  '<input class="field" id="sh-target" type="date" value="' + esc(dr.target) + '" data-model="sh-target"></div>' +
                '<p class="hint" style="grid-column:span 2">Mengubah tanggal target menghitung ulang status terlambat dan ikut memperbaiki kolom N di spreadsheet.</p></div>'
            : '<p class="hint" style="margin-left:22px">Terpisah karena jarang berubah: pembaruan harian hanya menyentuh status, progres, tanggal dan bukti di atas.</p>') +
        '</div>' +
      '</div>' +
      '<footer><p class="grow" style="font-size:11px;line-height:1.5;color:var(--muted)">' +
        (x.overdue ? 'Saat ini <b style="color:var(--late)">terlambat ' + Math.abs(x.daysToTarget) + ' hari</b>. ' : '') +
        'Menyimpan juga memperbaiki kolom <span class="mono">Status Terlambat</span>.</p>' +
        '<button type="button" class="btn" data-act="sheet-close">Batal</button>' +
        '<button type="button" class="btn primary" data-act="sheet-save"' + (blocked ? ' disabled' : '') + '>' + esc(saveLabel) + '</button></footer>' +
    '</section></div>';
  }

  /* ---------- modal ---------- */
  function modal() {
    var m = U.modal;
    if (!m) return '';
    if (m.kind === 'delete-case') {
      var items = S.itemsOf(m.iapId);
      var ok = m.text.trim().toUpperCase() === m.iapId;
      return '<div class="scrim center" data-act="modal-close-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="Konfirmasi hapus kasus">' +
        '<div style="display:flex;gap:13px"><span class="empty-ico" style="width:38px;height:38px;border-radius:10px;background:var(--late-soft);color:var(--late);display:grid;place-items:center;flex-shrink:0">' + I.warn(19) + '</span>' +
        '<div class="grow"><h2 style="font-size:16px;font-weight:700">Hapus kasus ' + esc(m.iapId) + '?</h2>' +
        '<p style="margin-top:7px;font-size:12.5px;line-height:1.6;color:var(--ink-mid)">Seluruh <b>' + items.length + ' baris</b> kasus ini dihapus dari sheet <span class="mono">Tracker</span>, kolom <span class="mono">No</span> dinomori ulang, dan konteks di kolom R–W ikut hilang. Tindakan ini tidak bisa dibatalkan.</p></div></div>' +
        '<label class="lbl" for="md-confirm" style="margin-top:18px">Ketik <span class="mono" style="color:var(--ink)">' + esc(m.iapId) + '</span> untuk mengonfirmasi</label>' +
        '<input class="field mono' + (m.text ? (ok ? ' on' : ' warn') : '') + '" id="md-confirm" type="text" value="' + esc(m.text) + '" placeholder="' + esc(m.iapId) + '" data-model="md-confirm">' +
        '<div style="margin-top:18px;display:flex;justify-content:flex-end;gap:10px">' +
          '<button type="button" class="btn" data-act="modal-close">Batal</button>' +
          '<button type="button" class="btn solid-danger" data-act="confirm-delete"' + (ok && !S.state.offline ? '' : ' disabled') + '>Hapus ' + items.length + ' baris</button></div>' +
      '</div></div>';
    }
    return '';
  }

  function toasts() {
    return S.state.ui.toasts.map(function (t) {
      return '<div class="toast' + (t.kind === 'bad' ? ' bad' : '') + '">' + esc(t.text) + '</div>';
    }).join('');
  }

  /* ---------- wizard ---------- */
  function wizard() {
    var w = U.wizard;
    var stage = w.stage;
    var idOk = /^IP\d{3}$/i.test(w.iapId.trim());
    var idFree = !S.caseOf(w.iapId.trim().toUpperCase());
    var stationOk = w.stationText.trim().length > 3;
    var titleOk = w.title.trim().length > 8;
    var s1 = idOk && idFree && stationOk && titleOk;
    var bad = w.steps.filter(function (s) { return !s.step.trim() || !s.pic.trim(); }).length;
    var s3 = w.steps.length > 0 && bad === 0;
    var filled = IAP.CTX_FIELDS.filter(function (f) { return (w.ctx[f.k] || '').trim(); }).length;

    var stepper = [
      { n: 1, title: 'Identitas kasus', note: s1 ? w.iapId.toUpperCase() + ' · ' + w.title.slice(0, 30) + (w.title.length > 30 ? '…' : '') : 'ID, stasiun dan judul kasus' },
      { n: 2, title: 'Konteks dokumen', note: filled + ' dari ' + IAP.CTX_FIELDS.length + ' bagian terisi — boleh dilengkapi nanti' },
      { n: 3, title: 'Matriks langkah', note: w.steps.length + ' langkah disusun' + (bad ? ' · ' + bad + ' belum lengkap' : '') }
    ].map(function (d, i) {
      var done = stage > d.n || stage === 4, now = stage === d.n;
      return '<li><span class="col"><button type="button" class="dot" data-state="' + (done ? 'done' : now ? 'now' : '') + '" data-act="wiz-go" data-val="' + d.n + '">' +
        (done ? I.check(14) : d.n) + '</button>' + (i < 2 ? '<span class="line' + (done ? ' done' : '') + '"></span>' : '') + '</span>' +
        '<span class="txt"><b>' + esc(d.title) + '</b><span>' + esc(d.note) + '</span></span></li>';
    }).join('');

    var body = '';
    if (stage === 1) {
      body = '<div style="display:flex;flex-direction:column;gap:16px">' +
        '<div><h2 style="font-size:15px;font-weight:600">Identitas kasus</h2>' +
        '<p style="margin-top:4px;font-size:12px;color:var(--muted)">Tiga hal ini menandai kasus di spreadsheet dan tidak bisa dikosongkan.</p></div>' +
        '<div style="display:grid;grid-template-columns:200px 1fr;gap:14px">' +
          '<div><label class="lbl" for="wz-id">ID IAP</label>' +
            '<input class="field mono' + (w.touched && (!idOk || !idFree) ? ' warn' : '') + '" id="wz-id" type="text" value="' + esc(w.iapId) + '" placeholder="IP955" data-model="wz-id">' +
            '<p class="hint' + (w.touched && (!idOk || !idFree) ? ' warn' : '') + '">' +
              (w.touched && !idOk ? 'Format: IP diikuti tiga angka, contoh IP955.' :
               w.touched && !idFree ? 'ID ini sudah dipakai kasus lain.' : 'Harus unik di seluruh spreadsheet.') + '</p></div>' +
          '<div><label class="lbl" for="wz-station">Stasiun / pihak terkait</label>' +
            '<input class="field' + (w.touched && !stationOk ? ' warn' : '') + '" id="wz-station" type="text" value="' + esc(w.stationText) + '" placeholder="PT Pelita Air Service — Stasiun CGK" data-model="wz-station">' +
            '<p class="hint">Sebutkan kode stasiun (CGK, DPS, KNO, SUB, UPG) agar cabangnya bisa dikenali. Terdeteksi: <b>' +
              (w.stations.length ? esc(w.stations.join(', ')) : 'belum ada') + '</b>.</p></div>' +
        '</div>' +
        '<div><label class="lbl" for="wz-title">Judul kasus</label>' +
          '<input class="field' + (w.touched && !titleOk ? ' warn' : '') + '" id="wz-title" type="text" value="' + esc(w.title) + '" placeholder="Insiden Ground Support Equipment di Apron Selatan" data-model="wz-title">' +
          '<p class="hint' + (w.touched && !titleOk ? ' warn' : '') + '">' + (w.touched && !titleOk ? 'Judul terlalu pendek untuk dikenali di daftar kasus.' : 'Muncul sebagai judul kasus di seluruh aplikasi dan di dokumen ekspor.') + '</p></div>' +
        '<div class="banner" style="background:var(--sunken);border:1px solid var(--line-soft);color:var(--muted)">' +
          '<div>Judul dan stasiun disalin ke setiap baris kasus ini (kolom C dan D), persis seperti yang dilakukan spreadsheet hari ini.</div></div>' +
      '</div>';
    } else if (stage === 2) {
      body = '<div style="display:flex;flex-direction:column;gap:14px;min-height:0">' +
        '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px">' +
          '<div><h2 style="font-size:15px;font-weight:600">Konteks dokumen</h2>' +
          '<p style="margin-top:4px;font-size:12px;color:var(--muted)">Bagian standar dokumen IAP, tersimpan di kolom R–W. Semuanya boleh dilengkapi setelah kasus dibuat.</p></div>' +
          '<span class="count">' + filled + ' dari ' + IAP.CTX_FIELDS.length + ' terisi</span></div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start">' +
          IAP.CTX_FIELDS.map(function (f) {
            var wide = f.rows >= 3;
            var v = w.ctx[f.k] || '';
            return '<div' + (wide ? ' style="grid-column:span 2"' : '') + '>' +
              '<label class="lbl" for="wc-' + f.k + '" style="display:flex;align-items:center;gap:7px">' + esc(f.label) +
              '<span class="pill sm ' + (v.trim() ? 'done' : 'idle') + '">' + (v.trim() ? 'terisi' : 'opsional') + '</span></label>' +
              '<textarea class="field" id="wc-' + f.k + '" rows="' + f.rows + '" data-model="wc-' + f.k + '" placeholder="Boleh dikosongkan">' + esc(v) + '</textarea></div>';
          }).join('') +
        '</div></div>';
    } else if (stage === 3) {
      body = '<div style="display:flex;flex-direction:column;gap:14px;min-height:0">' +
        '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px">' +
          '<div><h2 style="font-size:15px;font-weight:600">Matriks langkah perbaikan</h2>' +
          '<p style="margin-top:4px;font-size:12px;color:var(--muted)">Pindahkan dengan tombol panah. Nomor langkah diberikan otomatis dari urutannya.</p></div>' +
          '<span class="count">' + w.steps.length + ' langkah</span></div>' +
        '<div style="display:flex;flex-direction:column;gap:10px">' +
          w.steps.map(function (s, i) {
            var noName = !s.step.trim(), noPic = !s.pic.trim(), isBad = (noName || noPic) && w.touched;
            return '<article class="step-card' + (isBad ? ' bad' : '') + '">' +
              '<div class="head"><span class="move">' +
                '<button type="button" data-act="wiz-up" data-idx="' + i + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="Naikkan langkah ' + (i + 1) + '">' + I.up(10) + '</button>' +
                '<button type="button" data-act="wiz-down" data-idx="' + i + '"' + (i === w.steps.length - 1 ? ' disabled' : '') + ' aria-label="Turunkan langkah ' + (i + 1) + '">' + I.down(10) + '</button></span>' +
                '<span class="num ' + (isBad ? 'run' : '') + '">' + (i + 1) + '</span>' +
                '<label class="sr" for="wz-s' + i + '-step">Langkah perbaikan ' + (i + 1) + '</label>' +
                '<input class="field' + (noName && w.touched ? ' warn' : '') + '" id="wz-s' + i + '-step" type="text" value="' + esc(s.step) + '" placeholder="Nama langkah perbaikan" style="min-height:36px;font-weight:600" data-model="wz-step" data-idx="' + i + '">' +
                '<button type="button" class="btn icon danger" data-act="wiz-remove" data-idx="' + i + '"' + (w.steps.length === 1 ? ' disabled' : '') + ' aria-label="Hapus langkah ' + (i + 1) + '">' + I.trash(14) + '</button></div>' +
              '<div class="grid">' +
                '<span><label class="lbl" for="wz-s' + i + '-action" style="font-size:10.5px">Detail tindakan</label>' +
                  '<input class="field" id="wz-s' + i + '-action" type="text" value="' + esc(s.action) + '" placeholder="Apa yang dikerjakan" style="min-height:34px;font-size:12.5px" data-model="wz-action" data-idx="' + i + '"></span>' +
                '<span><label class="lbl" for="wz-s' + i + '-pic" style="font-size:10.5px">PIC</label>' +
                  '<input class="field' + (noPic && w.touched ? ' warn' : '') + '" id="wz-s' + i + '-pic" type="text" value="' + esc(s.pic) + '" placeholder="Pilih atau ketik…" list="pic-list" style="min-height:34px;font-size:12.5px" data-model="wz-pic" data-idx="' + i + '"></span>' +
                '<span><label class="lbl" for="wz-s' + i + '-target" style="font-size:10.5px">Tanggal target</label>' +
                  '<input class="field" id="wz-s' + i + '-target" type="date" value="' + esc(s.target) + '" style="min-height:34px;font-size:12.5px" data-model="wz-target" data-idx="' + i + '"></span>' +
              '</div>' +
              (isBad ? '<p class="hint warn">' + (noName && noPic ? 'Nama langkah dan PIC belum diisi.' : noName ? 'Nama langkah belum diisi.' : 'PIC belum diisi — langkah tidak bisa disimpan tanpa pemilik.') + '</p>' : '') +
            '</article>';
          }).join('') +
          '<datalist id="pic-list">' + ['Quality Assurance', 'Supervisor Ramp', 'Station Manager', 'Safety Officer', 'Duty Manager', 'Training Officer'].map(function (p) {
            return '<option value="' + esc(p + ' ' + (w.stations[0] || '')) + '"></option>';
          }).join('') + '</datalist>' +
          '<button type="button" class="add-row" style="min-height:46px" data-act="wiz-add">' + I.plus(15) + 'Tambah langkah</button>' +
        '</div></div>';
    } else {
      body = '<div class="empty" style="flex:1">' +
        '<span class="ico ok" style="width:56px;height:56px;border-radius:16px">' + I.check(28) + '</span>' +
        '<h2 style="font-size:19px">Kasus ' + esc(w.iapId.toUpperCase()) + ' dibuat</h2>' +
        '<p>' + w.steps.length + ' baris ditulis ke sheet Tracker dengan status Belum Dimulai dan progres 0%, dan ' + filled + ' dari ' + IAP.CTX_FIELDS.length +
          ' bagian konteks tersimpan di kolom R–W. Bagian yang kosong bisa dilengkapi kapan saja dari halaman kasus.</p>' +
        '<div style="margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center">' +
          '<a class="btn primary" href="#/kasus/' + esc(w.iapId.toUpperCase()) + '">Buka halaman kasus</a>' +
          '<a class="btn" href="#/kasus">Kembali ke daftar kasus</a></div>' +
        '<button type="button" class="btn ghost sm" data-act="wiz-restart">Buat kasus lain</button></div>';
    }

    var blocked = (stage === 1 && !s1) || (stage === 3 && !s3) || (stage === 3 && S.state.offline);
    var hintTxt = '', hintCls = '';
    if (stage === 1 && w.touched && !s1) { hintTxt = 'Lengkapi identitas kasus untuk lanjut.'; hintCls = ' warn'; }
    else if (stage === 2) hintTxt = 'Bagian yang kosong tidak akan ditampilkan di dokumen.';
    else if (stage === 3 && bad) { hintTxt = bad + ' langkah belum lengkap.'; hintCls = ' warn'; }
    else if (stage === 3) { hintTxt = 'Semua langkah siap disimpan.'; hintCls = ' ok'; }

    return IAP.views.topbar({
      title: 'Kasus IAP baru',
      sub: stage === 4 ? 'Selesai' : 'Langkah ' + stage + ' dari 3',
      right: '<span class="pill accent">' + I.check(13) + ' Draf tersimpan</span><a class="btn" href="#/kasus">Tutup</a>'
    }) +
    '<div class="page" id="main" style="padding:0">' +
      '<div class="wiz card" style="margin:22px 32px;border-radius:14px;overflow:hidden">' +
        '<aside class="wiz-side"><ol class="stepper">' + stepper + '</ol>' +
          '<div class="card" style="padding:14px 16px">' +
            '<h2 style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:11px">Yang akan dibuat</h2>' +
            '<dl class="dl" style="gap:9px">' +

  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (U.modal) { U.modal = null; S.emit(); return; }
      if (U.sheet) { U.sheet = null; backFromSheet(); return; }
      if (U.detail.menu) { U.detail.menu = false; S.emit(); }
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      var box = document.querySelector('.topbar input[type="search"]');
      if (box) { e.preventDefault(); box.focus(); box.select(); }
    }
  });

  /* ---------- boot ---------- */
  function onRoute() {
    route = parseHash();
    if (route.name === 'tracker') syncTrackerQuery(route.query);
    if (route.name === 'step') openSheet(route.params.id);
    else if (U.sheet && route.name !== 'step') U.sheet = null;
    if (route.name !== 'caseDetail' && route.name !== 'step') {
      U.detail.menu = false; U.detail.ctxEdit = false; U.detail.ctx = null; U.detail.showAll = false;
    }
    if (route.name !== 'wizard') U.wizard = null;
    if (route.name !== 'admin') U.admin.log = null;
    if (route.name === 'auth') U.auth.screen = route.params.screen;
    window.scrollTo(0, 0);
    render();
  }

  window.addEventListener('hashchange', onRoute);

  S.boot();
  route = parseHash();
  render();
  setTimeout(function () {
    booting = false;
    if (!S.state.session && route.name !== 'auth') { go('#/masuk'); route = parseHash(); }
    onRoute();
  }, 650);
})(window.IAP);
</script>
</body>
</html>
